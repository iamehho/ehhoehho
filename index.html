<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EhhoEhho Coin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- HERO -->
<section class="hero">
  <img src="images/hero-coin.png" class="hero-coin" alt="EhhoEhho Coin">
  
  <div class="ca-box">
    <span id="ca-text">ABCD...1234</span>
    <button onclick="copyCA()">COPY</button>
  </div>
</section>

<!-- CTA -->
<section class="cta">
  <a class="cta-btn" href="https://pump.fun" target="_blank">
    <img src="images/icon-buy.png"> BUY
  </a>
  <a class="cta-btn" href="https://dexscreener.com" target="_blank">
    <img src="images/icon-chart.png"> CHART
  </a>
  <button class="cta-btn" onclick="toggleCommunity()">
    <img src="images/community-card-bg.png"> COMMUNITY
  </button>
</section>

<!-- COMMUNITY -->
<section id="community" class="community hidden">
  <a href="https://x.com" target="_blank" class="community-card">
    <img src="images/icon-x.png"> X Official
  </a>
  <a href="https://x.com/i/communities" target="_blank" class="community-card">
    <img src="images/icon-x-community.png"> X Community
  </a>
  <a href="https://t.me" target="_blank" class="community-card">
    <img src="images/icon-telegram.png"> Telegram
  </a>
</section>

<!-- HOW TO BUY -->
<section class="howto">
  <h2>How to Buy</h2>
  <div class="steps">
    <div class="step"><img src="images/step-wallet.png"><p>① Wallet</p></div>
    <div class="step"><img src="images/step-sol.png"><p>② Get SOL</p></div>
    <div class="step"><img src="images/step-swap.png"><p>③ Swap</p></div>
    <div class="step"><img src="images/step-check-ca.png"><p>④ Check CA</p></div>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
