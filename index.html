<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EhhoEhho Coin</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="page">

    <!-- Header -->
    <header class="header">
      <h1 class="title">EhhoEhho Coin</h1>
      <div class="goldLine"></div>
      <p class="subtitle">Carry the day’s meme — ehho ehho.</p>
    </header>

    <!-- Hero coin -->
    <section class="hero">
      <img class="heroCoin" src="images/hero-coin.png" alt="EhhoEhho Coin" />
    </section>

    <!-- CA + Copy -->
    <section class="ca">
      <div class="caRow">
        <span class="caLabel">CA:</span>
        <span id="caText" class="caText">ABCD...1234</span>
        <button class="copyBtn" type="button" onclick="copyCA()">COPY</button>
      </div>
      <p class="caNote">⚠️ Beware of fake tokens. Use only the official CA.</p>
    </section>

    <!-- CTA buttons (BUY/CHART same size, Community same size too) -->
    <section class="cta">
      <a class="ctaBtn" href="https://pump.fun" target="_blank" rel="noopener">
        <img src="images/icon-buy.png" alt="Buy on Pump.fun" />
      </a>

      <a class="ctaBtn" href="https://dexscreener.com" target="_blank" rel="noopener">
        <img src="images/icon-chart.png" alt="Chart on DexScreener" />
      </a>

      <button class="ctaBtn ctaCommunity" type="button" onclick="toggleCommunity()" aria-expanded="false" id="communityToggle">
        <img src="images/community-card-bg.png" alt="Community" />
      </button>
    </section>

    <!-- Community expand -->
    <section class="communityWrap hidden" id="communityWrap">

      <a class="communityCard" href="https://x.com" target="_blank" rel="noopener">
        <img class="communityIcon" src="images/icon-x.png" alt="X Official" />
        <div class="communityText">
          <div class="communityTitle">X (Official)</div>
          <div class="communityDesc">最新情報・お知らせ / News & updates</div>
        </div>
        <span class="communityArrow">↗</span>
      </a>

      <a class="communityCard" href="https://x.com/i/communities" target="_blank" rel="noopener">
        <img class="communityIcon" src="images/icon-x-community.png" alt="X Community" />
        <div class="communityText">
          <div class="communityTitle">X Community</div>
          <div class="communityDesc">雑談・ネタ投稿 / Talk & memes</div>
        </div>
        <span class="communityArrow">↗</span>
      </a>

      <a class="communityCard" href="https://t.me" target="_blank" rel="noopener">
        <img class="communityIcon" src="images/icon-telegram.png" alt="Telegram" />
        <div class="communityText">
          <div class="communityTitle">Telegram</div>
          <div class="communityDesc">濃い交流・速報 / Chat & alerts</div>
        </div>
        <span class="communityArrow">↗</span>
      </a>

    </section>

    <!-- How to Buy (no text, bigger images, 2x2) -->
    <section class="howto">
      <h2 class="sectionTitle">How to Buy</h2>

      <div class="steps">
        <div class="step">
          <img src="images/step-wallet.png" alt="Create wallet" />
        </div>

        <div class="step">
          <img src="images/step-sol.png" alt="Get SOL" />
        </div>

        <div class="step">
          <img src="images/step-swap.png" alt="Swap on Pump.fun" />
        </div>

        <div class="step">
          <img src="images/step-check-ca.png" alt="Check CA" />
        </div>
      </div>
    </section>

    <footer class="footer">
      <small>© EhhoEhho Coin</small>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
